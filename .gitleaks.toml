# gitleaks 配置：让"豁免约定"与红线检查器统一（2026-09-13）
#
# ## 为什么有这个文件
# 库里有**两套**密钥检查器，各扫各的：
#   · `scripts/redline-check.ps1`（轻量、秒级）—— 认**行内**标记 `redline-allow`
#   · `scripts/quality-gate.ps1` 的 A3 —— 调 **gitleaks** 扫 git 历史
# 它们的豁免约定原本**不互通**：实测在库自己的仓库上，gitleaks 因为
# `scripts/self-test.mjs` 里那批"造个假密钥当样例"的夹具报了 **2 处泄露**
# （`GOOGLE_KEY=AIzaSy…`、`GITLAB=glpat-…`），而那些行**已经**带了 `redline-allow`。
# 结论：不是夹具错了，是**两个工具对"这是样例、不是真密钥"这件事没有共同语言**。
#
# ## 约定（改这条要先改文档）
# **同一行里出现 `redline-allow` ⇒ 两个检查器都放行。**
# 于是"豁免"只有一个写法、一处评审点：它在 diff 里看得见，而且**红线会把豁免条数报出来**
# （不静默）。真密钥**不许**这么标 —— 这条是纪律，不是机器能判的。
#
# ## 为什么不干脆把夹具改成运行时拼接
# 那样确实能让 gitleaks 闭嘴，但也会把"这两种当代密钥格式会被扫到"的样例变得不可读
# （夹具必须长得像真密钥，才有测试价值）。用统一标记更诚实：豁免是**显式**的。
[extend]
useDefault = true

[[allowlists]]
description = "行内含 redline-allow（大小写不敏感）的命中：与红线检查器共用同一套豁免约定（样例/夹具用；真密钥不许这么标）"
regexTarget = "line"
# ⚠️ `(?i)` 不是装饰（第六轮复审实测抓到的**约定不统一**）：红线那边的
#    `$ALLOW_RE = '(?i)redline-allow'` 是**大小写不敏感**的，而这里原本没有 `(?i)` ⇒
#    同一行写 `# Redline-Allow: x` 时：**红线说"放行"、gitleaks 说"泄露"（1 处）** ——
#    一行两个结论，正是本文件要消掉的那种病灶。现在两边都是不敏感。
regexes = [
  '''(?i)redline-allow''',
]
